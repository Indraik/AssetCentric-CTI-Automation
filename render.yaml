services:
  - type: web
    name: cyber-threat-intelligence
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ABUSEIPDB_API_KEY
        sync: false # Set in Render dashboard if AbuseIPDB collector is desired
